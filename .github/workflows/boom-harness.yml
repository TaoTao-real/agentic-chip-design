name: BOOM harness public checks

on:
  pull_request:
    paths:
      - "experiments/boom-v2/harness/**"
      - ".github/workflows/boom-harness.yml"
  push:
    branches: [main]
    paths:
      - "experiments/boom-v2/harness/**"
      - ".github/workflows/boom-harness.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/boom-v2/harness/pyproject.toml
      - name: Install harness
        working-directory: experiments/boom-v2/harness
        run: python -m pip install -e .
      - name: Run public-safe checks
        working-directory: experiments/boom-v2/harness
        run: |
          python -m unittest chia_boom.tests.test_chipcontext -v
          python -m unittest discover -s chia_boom/tests -v
          python -m compileall -q chia_boom
          chia-boom --help
          chia-chipcontext --help
          bash -n chia_boom/scripts/*.sh
